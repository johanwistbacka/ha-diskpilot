# Isolerad utvecklingsmiljö. Inga riktiga enheter, konton eller prisflöden.
homeassistant:
  name: Diskpilot TEST
  time_zone: Europe/Stockholm
  unit_system: metric
  country: SE
  latitude: 0
  longitude: 0
  elevation: 0

http:
  server_host: 127.0.0.1
  server_port: 8124

frontend:
config:
history:
system_log:
logger:
  default: warning
  logs:
    custom_components.dishwasher_optimizer: info

recorder:
  purge_keep_days: 3
  include:
    entity_globs:
      - sensor.diskpilot_*
      - sensor.testdiskmaskin_*
      - sensor.test_diskmaskin_*
      - input_number.diskpilot_test_power

input_number:
  diskpilot_test_power:
    name: TEST Effekt
    min: 0
    max: 2500
    step: 0.1
    initial: 0.3
    unit_of_measurement: W
    mode: box

template:
  - sensor:
      - name: Diskpilot Test Power
        unique_id: diskpilot_local_test_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        state: "{{ states('input_number.diskpilot_test_power') }}"
        availability: "{{ has_value('input_number.diskpilot_test_power') }}"
      - name: Diskpilot Test Price
        unique_id: diskpilot_local_test_price
        unit_of_measurement: SEK/kWh
        state: '1.0'
        attributes:
          test_data: true
          prices: >-
            {% set ns = namespace(rows=[]) %}
            {% set base = (as_timestamp(now()) // 900) * 900 %}
            {% for i in range(193) %}
              {% set value = [-0.2, 0.4, 0.8, 1.6, 2.0, 1.1, 0.6, 0.3][(i // 4) % 8] %}
              {% set ns.rows = ns.rows + [{
                'start': as_datetime(base + i * 900).isoformat(),
                'end': as_datetime(base + (i + 1) * 900).isoformat(),
                'value': value
              }] %}
            {% endfor %}
            {{ ns.rows }}

script:
  diskpilot_simulate_cycle:
    alias: TEST Simulera kort diskkörning
    description: Simulerad effekt i drygt två minuter, följd av viloläge. Styr ingen apparat.
    mode: single
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.diskpilot_test_power
        data:
          value: 200
      - delay: '00:02:10'
      - action: input_number.set_value
        target:
          entity_id: input_number.diskpilot_test_power
        data:
          value: 0.3
