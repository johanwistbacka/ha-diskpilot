get_runs:
  name: Export runs
  description: Return stored runs with minute energy in Wh for analysis and backup.
  fields:
    entry_id:
      required: true
      selector:
        text:
    offset:
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    limit:
      selector:
        number:
          min: 1
          max: 100
          mode: box
label_run:
  name: Label run
  description: Assign or correct a program label and rebuild the learned profiles.
  fields:
    entry_id:
      required: true
      selector:
        text:
    run_id:
      required: true
      selector:
        text:
    program:
      required: true
      selector:
        text:
    note:
      selector:
        text:
          multiline: true
import_run:
  name: Import run
  description: Import one complete measured curve. No files or remote URLs are opened.
  fields:
    entry_id:
      required: true
      selector:
        text:
    started_at:
      required: true
      example: '2026-01-01T23:00:00+01:00'
      selector:
        text:
    duration_seconds:
      required: true
      selector:
        number:
          min: 1
          max: 28800
          mode: box
    energy_wh:
      required: true
      selector:
        object:
    program:
      selector:
        text:
    note:
      selector:
        text:
          multiline: true
save_profile:
  name: Save profile
  description: Create a named profile or rename an existing profile without losing measurements.
  fields:
    entry_id:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    profile_id:
      selector:
        text:
preview_profile_file:
  name: Preview profile file
  description: Validate local CSV or JSON content and return a preview without saving.
  fields:
    entry_id:
      required: true
      selector:
        text:
    filename:
      required: true
      selector:
        text:
    content:
      required: true
      selector:
        text:
          multiline: true
import_profile_file:
  name: Import profile file
  description: Add validated complete runs from a CSV or JSON file to a named profile.
  fields:
    entry_id:
      required: true
      selector:
        text:
    filename:
      required: true
      selector:
        text:
    content:
      required: true
      selector:
        text:
          multiline: true
    profile_id:
      selector:
        text:
    name:
      selector:
        text:

get_registration:
  name: Get registration
  description: Read the current draft or recalculate a selected interval without saving.
  fields:
    entry_id:
      required: true
      selector:
        text:
    draft_id:
      selector:
        text:
    started_at:
      selector:
        text:
    ended_at:
      selector:
        text:

start_registration:
  name: Start registration
  description: Start a private draft from the configured power sensor. Stops after eight hours at the latest.
  fields:
    entry_id:
      required: true
      selector:
        text:
    end_at:
      selector:
        text:

stop_registration:
  name: Stop registration
  description: Finish recording and open review. Does not add a run to a profile.
  fields:
    entry_id:
      required: true
      selector:
        text:
    draft_id:
      required: true
      selector:
        text:

discard_registration:
  name: Discard registration
  description: Delete only the specified draft. Existing runs and profiles are retained.
  fields:
    entry_id:
      required: true
      selector:
        text:
    draft_id:
      required: true
      selector:
        text:

history_registration:
  name: Register from history
  description: Read a past interval of up to eight hours from Recorder into a reviewable draft.
  fields:
    entry_id:
      required: true
      selector:
        text:
    started_at:
      required: true
      selector:
        text:
    ended_at:
      required: true
      selector:
        text:

save_registration:
  name: Save reviewed registration
  description: Add the selected complete interval to a new or existing profile after explicit confirmation.
  fields:
    entry_id:
      required: true
      selector:
        text:
    draft_id:
      required: true
      selector:
        text:
    started_at:
      required: true
      selector:
        text:
    ended_at:
      required: true
      selector:
        text:
    confirmed:
      required: true
      selector:
        boolean:
    profile_id:
      selector:
        text:
    name:
      selector:
        text:
