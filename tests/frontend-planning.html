<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diskpilot · syntetiskt interaktionstest</title>
<style>
body{font:14px system-ui;margin:16px;background:#f4f6f7;color:#222;--primary-text-color:#222;--secondary-text-color:#62686c;--primary-color:#087ea4;--card-background-color:#fff;--secondary-background-color:#eef1f3;--divider-color:#ddd;--success-color:#268246;--warning-color:#c18c00;--error-color:#cc3c32}
ha-card{display:block;background:#fff;border:1px solid #ddd;border-radius:12px}diskpilot-card{display:block;max-width:680px;margin:12px 0}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{padding:8px}#requests{font-size:12px}body.dark{background:#111;color:#eee;--primary-text-color:#eee;--secondary-text-color:#b6bec4;--primary-color:#4cb3e1;--card-background-color:#21252a;--secondary-background-color:#30363c;--divider-color:#49515a}
</style>
<h1>Syntetiskt korttest</h1><p>Inga apparater, lagrade körningar eller externa tjänster används.</p>
<nav><button id="refresh">Prisuppdatering</button><button id="delay">Fördröj nästa svar</button><button id="release">Släpp väntande svar</button><button id="fault">Fel nästa svar</button><button id="role">Växla administratör</button><button id="missing">Prislucka</button><button id="flat">Negativt fast pris</button><button id="theme">Ljust/mörkt</button><button id="currency">Byt valuta</button><button id="zone">Byt tidszon</button></nav>
<p id="requests" role="status"></p><diskpilot-card></diskpilot-card>
<script type="module">
import '../custom_components/dishwasher_optimizer/www/diskpilot-card.js';
const now=Math.floor(Date.now()/60000)*60,entry='synthetic',card=document.querySelector('diskpilot-card');let revision=1,admin=true,delayed=false,fail=false,release=[],gap=false,flat=false,calls=0,currency="SEK",zone="Europe/Stockholm";
const profiles=[['short','P3 · Snabb',75],['hot','P2 · 70 °C',150],['eco','P4 · Eco med ett avsiktligt mycket långt eget profilnamn',220]].map(([id,name,duration],index)=>({id,name,duration_seconds:duration*60,energy_wh:Array.from({length:duration},(_,i)=>i<15||i>duration-20?18:index===2?1.1:2.3),sample_count:index+1}));
let hass={user:{is_admin:true},config:{time_zone:'Europe/Stockholm'},locale:{language:'sv-SE'},states:{},callWS:async({service,service_data})=>{
 if(service!=='get_plan')throw Error('Testet är skrivskyddat.');calls++;document.querySelector('#requests').textContent=`Anrop: ${calls} · start: ${service_data.started_at||'Nu'}`;
 const shouldFail=fail;fail=false;const start=service_data.started_at?Date.parse(service_data.started_at)/1000:Date.now()/1000;
 const data={entry_id:entry,revision,now:Date.now()/1000,selected_start:start,generated_at:now,planning_deadline:now+86400,currency,price_status:'ok',prices:Array.from({length:96},(_,i)=>[now+i*900,now+(i+1)*900,flat?-1:1+Math.sin(i/96*Math.PI*4)]).filter((_,i)=>!gap||i!==5),profiles:profiles.map((p,index)=>({...p,energy_kwh:p.energy_wh.reduce((a,b)=>a+b,0)/1000,selected_cost:start>now+86000?null:(start-now)/36000+index+.7,selected_end:start+p.duration_seconds,optimal_start:now+(index+1)*3600,cost:.5+index}))};
 if(delayed){delayed=false;await new Promise(resolve=>release.push(resolve));}if(shouldFail)throw Error('Syntetiskt anslutningsfel');return{response:data};
}};
function refresh(){hass={...hass,user:{is_admin:admin},config:{time_zone:zone},states:{'sensor.synthetic':{entity_id:'sensor.synthetic',state:'planner',attributes:{diskpilot_entry_id:entry,plan_revision:revision++,profiles:profiles.map(({id,name})=>({id,name})),recent_runs:[]}},...Object.fromEntries(profiles.map(p=>['sensor.'+p.id,{state:String(.5),attributes:{program:p.id,diskpilot_entry_id:entry,currency,energy_kwh:.5,sample_count:p.sample_count,duration_minutes:p.duration_seconds/60,optimal_start:new Date((now+3600)*1000).toISOString()}}]))}};card.hass=hass;}
card.setConfig({entry_id:entry,title:'Diskmaskinen'});refresh();
document.querySelector('#refresh').onclick=refresh;
document.querySelector('#delay').onclick=()=>{delayed=true;};document.querySelector('#release').onclick=()=>{release.splice(0).forEach(fn=>fn());};document.querySelector('#fault').onclick=()=>{fail=true;refresh();};document.querySelector('#role').onclick=()=>{admin=!admin;refresh();};document.querySelector('#missing').onclick=()=>{gap=!gap;refresh();};document.querySelector('#flat').onclick=()=>{flat=!flat;refresh();};document.querySelector('#currency').onclick=()=>{currency=currency==='SEK'?'EUR':'SEK';refresh();};document.querySelector('#zone').onclick=()=>{zone=zone==='Europe/Stockholm'?'UTC':'Europe/Stockholm';refresh();};document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
</script>
